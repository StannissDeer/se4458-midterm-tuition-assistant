# Local stack: PostgreSQL + Tuition API + MCP server + Kong API Gateway.
#   docker compose up --build
# Gateway:  http://localhost:8080   (all REST traffic)
# MCP:      http://localhost:8100/mcp (agent's MCP client, not via gateway)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tuition
      POSTGRES_USER: tuition
      POSTGRES_PASSWORD: tuition
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuition -d tuition"]
      interval: 3s
      retries: 20

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg2://tuition:tuition@db:5432/tuition
      JWT_SECRET: change-me-dev-secret-at-least-32-bytes!!
      JWT_ISSUER: tuition-auth
    depends_on:
      db: { condition: service_healthy }
    # Not published on the host on purpose: clients must go through Kong.
    expose: ["8000"]

  mcp:
    build: ./mcp_server
    ports: ["8100:8100"]

  kong:
    image: kong:3.9
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    volumes: ["./gateway/kong.yml:/kong/kong.yml:ro"]
    ports:
      - "8080:8000"   # gateway proxy
      - "8001:8001"   # admin API (route inspection: curl localhost:8001/routes)
    depends_on: [api]

volumes:
  pgdata:
